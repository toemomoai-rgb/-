name: Publish driving simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const base = process.env.PAGE_URL;
          if (!base) throw new Error('Deployment did not return a URL');
          let lastError;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(base);
              if (!response.ok) throw new Error(`Page returned HTTP ${response.status}`);
              const html = await response.text();
              if (!html.includes('id="root"')) throw new Error('Simulator page missing');
              const asset = html.match(/src="([^\"]+\.js)"/);
              if (!asset) throw new Error('Application bundle missing');
              const bundle = await fetch(new URL(asset[1], base));
              if (!bundle.ok) throw new Error(`Bundle returned HTTP ${bundle.status}`);
              console.log(`Published page and bundle verified: ${base}`);
              process.exit(0);
            } catch (error) { lastError = error; await new Promise(resolve => setTimeout(resolve, 5000)); }
          }
          throw lastError;
          JS
